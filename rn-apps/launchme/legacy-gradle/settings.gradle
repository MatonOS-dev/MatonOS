pluginManagement {
    includeBuild('node_modules/@react-native/gradle-plugin')
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
plugins { id('com.facebook.react.settings') }
extensions.configure(com.facebook.react.ReactSettingsExtension) {
    it.autolinkLibrariesFromCommand(
            ['npx', '@react-native-community/cli', 'config'], settingsDir,
            files('package.json', 'package-lock.json', 'react-native.config.js'))
}
includeBuild('node_modules/@react-native/gradle-plugin')

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'MatonOSShell'
include ':matonos-client'
project(':matonos-client').projectDir = file('../../device/maton/pc_x86_64/buildinfra/client')
