plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.matonos.settings.nativebridge'
version = '0.1.0'

android {
  namespace 'org.matonos.settings.nativebridge'
  defaultConfig { minSdk 32; versionCode 1; versionName '0.1.0' }
  buildFeatures { aidl true }
  sourceSets.main.aidl.srcDirs = [file('aidl')]
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':matonos-client')
  implementation 'org.tukaani:xz:1.12'
}
