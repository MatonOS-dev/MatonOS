plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.matonos.rncommon'
version = '0.1.0'

android {
  namespace 'org.matonos.rncommon'
  defaultConfig { minSdk 32; versionCode 1; versionName '0.1.0' }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':matonos-client')
}
