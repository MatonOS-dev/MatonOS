# One instance in the signed stub's process/UID. Android owns the hardware.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    default.clock.rate = 48000
    default.clock.quantum = 512
    default.clock.min-quantum = 128
    default.clock.max-quantum = 2048
    mem.allow-mlock = false
    support.dbus = false
    loop.cancel = false
}
context.spa-libs = {
    audio.convert.* = libspa-audioconvert
    audio.adapt = libspa-audioconvert
    support.* = libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-metadata }
    # Only this app UID can reach these 0600 sockets. No external manager.
    { name = libpipewire-module-access args = { access.legacy = true } }
    { name = libpipewire-module-protocol-pulse }
]
context.objects = [
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = Maton-Clock
        priority.driver = 20000
        node.group = maton.audio
    } }
    { factory = metadata args = {
        metadata.name = default
        metadata.values = [
            { key = default.audio.sink value = { name = maton.android } }
        ]
    } }
]
pulse.properties = {
    server.address = [ "unix:native" ]
    pulse.min.req = 128/48000
    pulse.default.req = 512/48000
    pulse.default.tlength = 2048/48000
}
stream.properties = {
    adapter.auto-port-config = { mode = dsp position = preserve }
}
