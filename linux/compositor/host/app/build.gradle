plugins { id 'com.android.application' }

dependencies {
    // 5.2.2 is the newest stable release available for this port. Move to
    // 6.x when it is released; upstream's 6.x line is not released yet.
    implementation files('libs/dbus-java-core-5.2.2.jar', 'libs/slf4j-api-2.0.17.jar', 'libs/slf4j-nop-2.0.17.jar')
}

tasks.register('verifyDbusVendoredJars') {
    inputs.file('libs/SHA256SUMS')
    inputs.files(fileTree('libs') { include '*.jar' })
    doLast {
        def expected = [:]
        file('libs/SHA256SUMS').eachLine { line ->
            def (hash, name) = line.trim().split(/\s+/, 2)
            expected[name] = hash
        }
        expected.each { name, hash ->
            def jar = file("libs/${name}")
            if (!jar.isFile() || java.security.MessageDigest.getInstance('SHA-256')
                    .digest(jar.bytes).encodeHex().toString() != hash) {
                throw new GradleException("Vendored D-Bus dependency checksum mismatch: ${name}")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyDbusVendoredJars' }

// A PIE executable named as a JNI library so updates extract it with executable
// permissions. The image extracts its copy from this same APK (buildinfra).
def brokerRoot = file('../../../dbus-broker')
def brokerOutput = System.getenv('MATON_DBUS_ANDROID_OUT') ?: layout.buildDirectory.dir('broker/android').get().asFile.absolutePath
def aospRoot = System.getenv('MATON_AOSP_ROOT') ?: file('../../../../../../..').absolutePath
def brokerJni = new File(layout.buildDirectory.get().asFile, 'generated/brokerJni')
def buildSessionBroker = tasks.register('buildSessionBroker', Exec) {
    inputs.dir brokerRoot
    outputs.dir brokerOutput
    // build-android.sh also tracks the external static dependency builds.
    outputs.upToDateWhen { false }
    environment 'MATON_DBUS_ANDROID_OUT', brokerOutput
    environment 'MATON_AOSP_ROOT', aospRoot
    if (System.getenv('MATON_NDK')) environment 'MATON_ANDROID_NDK', System.getenv('MATON_NDK')
    commandLine 'bash', new File(brokerRoot, 'build-android.sh').absolutePath
}
def packageSessionBroker = tasks.register('packageSessionBroker', Copy) {
    dependsOn buildSessionBroker
    from(new File(brokerOutput, 'matonos-dbus-broker'))
    into new File(brokerJni, 'x86_64')
    rename { 'libmatonos-dbus-broker.so' }
}
tasks.named('preBuild').configure { dependsOn packageSessionBroker }

android {
    namespace 'org.matonos.compositor'
    compileSdk 36
    defaultConfig {
        applicationId 'org.matonos.compositor'; minSdk 36; targetSdk 36; versionCode 1; versionName '1.0'
        ndk { abiFilters 'x86_64' }
        externalNativeBuild { cmake { arguments '-DMATON_COMPOSITOR_ROOT=' + projectDir.absolutePath + '/../..', '-DMATON_AOSP_ROOT=' + aospRoot, '-DMATON_COMPOSITOR_BUILD=' + (System.getenv('MATON_COMPOSITOR_BUILD') ?: "$aospRoot/out/matonos/compositor") } }
    }
    buildFeatures { aidl true }
    packaging {
        jniLibs {
            // Keep extractNativeLibs=true for the broker in adb-installed updates.
            // build-apps.sh stores/page-aligns JNI before signing the staged APK
            // so the preinstalled copy can also load JNI directly from the ZIP.
            useLegacyPackaging = true
            // Preserve the executable ELF, rather than treating it as a DSO.
            keepDebugSymbols += '**/libmatonos-dbus-broker.so'
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('MATON_SIGNING_STORE_FILE'))
            storePassword System.getenv('MATON_SIGNING_STORE_PASSWORD')
            keyAlias System.getenv('MATON_SIGNING_KEY_ALIAS')
            keyPassword System.getenv('MATON_SIGNING_KEY_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    externalNativeBuild { cmake { path '../../native/CMakeLists.txt' } }
    ndkVersion '30.0.16248370'
    ndkPath System.getenv('MATON_NDK') ?: "${System.getProperty('user.home')}/Documents/android-ndk-r30"
    sourceSets {
        main {
            aidl.srcDirs += file("$rootDir/../../../systembridge/aidl")
            jniLibs.srcDirs += file(System.getenv('MATON_COMPOSITOR_JNI_LIBS') ?: "$aospRoot/out/matonos/compositor/jniLibs")
            jniLibs.srcDir brokerJni
        }
    }
}
