wireplumber.profiles = {
  main-embedded = {
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
  }
}

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = true
      }
    }
  }
]
