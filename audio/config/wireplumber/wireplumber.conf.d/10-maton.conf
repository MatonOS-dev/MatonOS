wireplumber.profiles = {
  main = {
    hardware.bluetooth = disabled
    hardware.video-capture = required
    support.dbus = disabled
    support.system-dbus = disabled
    support.portal-permissionstore = disabled
    support.reserve-device = disabled
    support.modem-manager = disabled
    support.mpris = disabled
    api.notifications = disabled
  }
  main-embedded = {
    hardware.bluetooth = disabled
    hardware.video-capture = required
  }
}

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = true
      }
    }
  }
]

# Android's stream volumes are the only user-facing volume. PipeWire sinks run
# at unity so they don't stack a second attenuation (WirePlumber's default is
# 0.064 = 0.4^3, which left media ~24 dB quiet on top of the Android index).
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
